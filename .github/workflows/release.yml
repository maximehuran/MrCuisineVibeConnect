# Fork-only publishing. The upstream PR keeps the original release workflow.
name: Fork releases
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fork-releases
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'maximehuran/MrCuisineVibeConnect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Release workspace
        run: |
          echo "RELEASE_PLAN=$RUNNER_TEMP/fork-release/plan.json" >> "$GITHUB_ENV"
          echo "REFERENCE_BUILD_DIR=$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      - name: Check stable upstream release and prepare local merge
        id: prepare
        run: python3 tools/fork/release.py prepare --plan "$RELEASE_PLAN"
      - uses: actions/setup-java@v4
        if: steps.prepare.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Fork release policy and SQLite migration tests
        if: steps.prepare.outputs.publish == 'true'
        run: |
          python3 tools/test_fork_release.py
          python3 tools/test_recipe_storage.py
      - name: Prepare reference from the selected official release
        if: steps.prepare.outputs.publish == 'true'
        run: |
          sha=$(python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_PLAN"]))["upstream"]["sha"])')
          python3 tools/fork/prepare_reference.py --sha "$sha" --directory "$REFERENCE_BUILD_DIR"
      - name: Unit tests and signed Android build
        if: steps.prepare.outputs.publish == 'true'
        env:
          FORK_VERSION: ${{ steps.prepare.outputs.version }}
          FORK_CODE: ${{ steps.prepare.outputs.code }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease :app:assembleAndroidTest -PforkVersionName="$FORK_VERSION" -PforkVersionCode="$FORK_CODE" -PtoqueEdition=fork
      - name: Reference unit tests and signed APK
        if: steps.prepare.outputs.publish == 'true'
        env:
          FORK_VERSION: ${{ steps.prepare.outputs.version }}
          FORK_CODE: ${{ steps.prepare.outputs.code }}
        run: |
          cd "$REFERENCE_BUILD_DIR"
          ./gradlew --no-daemon :core:test :app:assembleRelease -PforkVersionName="$FORK_VERSION" -PforkVersionCode="$FORK_CODE" -PtoqueEdition=reference
      - name: Enable emulator acceleration
        if: steps.prepare.outputs.publish == 'true'
        run: sudo chmod 666 /dev/kvm
      - name: Android 6 edition round trip, favorite persistence and HTTPS
        if: steps.prepare.outputs.publish == 'true'
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 23
          target: default
          arch: x86_64
          emulator-boot-timeout: 300
          script: python3 tools/fork/smoke_android6.py
      - name: Verify APK, commit only the tested merge and publish
        if: steps.prepare.outputs.publish == 'true'
        run: python3 tools/fork/release.py publish --plan "$RELEASE_PLAN"
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outputs.publish == 'true'
        with:
          name: fork-unit-test-reports
          path: core/build/reports/tests/test/
      - name: Record failure without publishing a replacement
        if: failure()
        run: |
          echo '## Fork update stopped' >> "$GITHUB_STEP_SUMMARY"
          echo 'Merge conflict, failed validation or publishing error: inspect this run. No untested APK is offered to the robot. Its installed app is unchanged.' >> "$GITHUB_STEP_SUMMARY"
