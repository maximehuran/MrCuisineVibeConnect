name: Tests
on:
  pull_request:
  push:
    branches: ['feat/**', 'fork/**']
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SQLite migration and source isolation
        run: python3 tools/test_recipe_storage.py
      - name: Fork release policy and merge behavior
        run: python3 tools/test_fork_release.py
      - name: Prepare reference from the latest official release
        run: |
          echo "REFERENCE_BUILD_DIR=$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
          python3 tools/fork/prepare_reference.py --directory "$RUNNER_TEMP/reference"
          python3 tools/fork/test_reference.py --directory "$RUNNER_TEMP/reference"
      - name: Fork unit tests and APKs
        run: ./gradlew --no-daemon :core:test :app:assembleRelease :app:assembleAndroidTest -PforkVersionName=0.5.1.999 -PforkVersionCode=10999 -PtoqueEdition=fork
      - name: Reference unit tests and APK
        run: |
          cd "$REFERENCE_BUILD_DIR"
          ./gradlew --no-daemon :core:test :app:assembleRelease -PforkVersionName=0.5.1.999 -PforkVersionCode=10999 -PtoqueEdition=reference
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 6 edition round trip, favorite persistence and HTTPS
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 23
          target: default
          arch: x86_64
          emulator-boot-timeout: 300
          script: python3 tools/fork/smoke_android6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: core/build/reports/tests/test/
