name: Tests
on:
  pull_request:
  push:
    branches: ['feat/**', 'fork/**']
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SQLite migration and source isolation
        run: python3 tools/test_recipe_storage.py
      - name: Fork release policy and merge behavior
        run: python3 tools/test_fork_release.py
      - name: Unit tests and Android build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: core/build/reports/tests/test/
